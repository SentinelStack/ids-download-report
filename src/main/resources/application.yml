server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ids-download-report
  datasource:
    # compress=0: skip LZ4 (lib not bundled; connection is localhost so it's free).
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/sentinel?compress=0}
    username: ${CLICKHOUSE_USER:sentinel}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      maximum-pool-size: ${CLICKHOUSE_POOL:8}
      connection-timeout: 10000
  mvc:
    async:
      request-timeout: 120000

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  clickhouse:
    database: ${CLICKHOUSE_DATABASE:sentinel}
    alerts-table: ${CLICKHOUSE_ALERTS_TABLE:alerts}
  download:
    max-rows: ${DOWNLOAD_MAX_ROWS:200000}
    default-rows: ${DOWNLOAD_DEFAULT_ROWS:50000}
    preview-rows: ${DOWNLOAD_PREVIEW_ROWS:100}
